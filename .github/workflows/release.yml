name: Release

# Pushing a tag like v0.1.0 builds the binaries with `make cross` and
# publishes them, with their checksums, as a GitHub release of that tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: make cross VERSION=${{ github.ref_name }}
      - run: cd dist && sha256sum * > checksums.txt
      - run: gh release create ${{ github.ref_name }} dist/* --title ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
