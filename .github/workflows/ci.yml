name: CI

# Pushes to main and pull requests; other branches are tested in their
# pull requests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF line endings on Windows; tests compare output byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Formatting doesn't depend on the OS; check it once.
      - if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      # staticcheck looks at one OS's files at a time; the Linux runner
      # checks all three, so the dearer runners don't build it.
      - if: runner.os == 'Linux'
        run: make staticcheck
      # The race detector on Linux only: it is slower, and the code it
      # guards (supervisor, proc, tui) is mostly the same on every OS.
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - if: runner.os != 'Linux'
        run: go test ./...
